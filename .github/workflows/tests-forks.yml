name: tests-forks
on:
  workflow_run:
    workflows: [tests]
    types: [completed]
  workflow_dispatch:
    inputs:
      pr:
        description: PR number of the fork PR to test
        required: true
        type: number

permissions:
  contents: read
  actions: read
  checks: write
  issues: write
  pull-requests: write

concurrency:
  group: tests-forks-${{ inputs.pr || format('{0}:{1}', github.event.workflow_run.head_repository.full_name, github.event.workflow_run.head_branch) }}
  cancel-in-progress: true

jobs:
  tests:
    if: >-
      github.event_name == 'workflow_dispatch' || (
        github.event.workflow_run.event == 'pull_request' &&
        github.event.workflow_run.head_repository.full_name != github.repository
      )
    runs-on: ubuntu-latest
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      BUNDLE_DIR: ${{ github.workspace }}/../tests-forks-uploads
    steps:
      - name: Find the PR for the finished build
        id: pr
        if: github.event_name == 'workflow_run'
        env:
          HEAD: ${{ github.event.workflow_run.head_repository.owner.login }}:${{ github.event.workflow_run.head_branch }}
          BASE: ${{ github.event.repository.default_branch }}
        run: echo "number=$(gh api -X GET "repos/${{ github.repository }}/pulls" -f head="$HEAD" -f base="$BASE" --jq '.[0].number // empty')" >> "$GITHUB_OUTPUT"

      - name: Find the PR's build
        env:
          PR: ${{ inputs.pr || steps.pr.outputs.number }}
          BUILT_SHA: ${{ github.event.workflow_run.head_sha }}
          BUILT_RUN: ${{ github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.id || '' }}
        run: |
          test -n "$PR" || { echo "::error::No open PR for this build."; exit 1; }
          sha=${BUILT_SHA:-$(gh api "repos/${{ github.repository }}/pulls/$PR" --jq .head.sha)}
          run=${BUILT_RUN:-$(gh api -X GET "repos/${{ github.repository }}/actions/workflows/tests.yml/runs" \
            -f head_sha="$sha" -f event=pull_request \
            --jq '[.workflow_runs[] | select(.conclusion == "success")][0].id // empty')}
          echo "NEVERMORE_CI_PR_NUMBER=$PR" >> "$GITHUB_ENV"
          echo "HEAD_SHA=$sha" >> "$GITHUB_ENV"
          echo "BUILD_RUN_ID=$run" >> "$GITHUB_ENV"
          test -n "$run" || { echo "::error::PR #$PR has no successful tests-build at $sha."; exit 1; }

      - name: Checkout main
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          cache: true

      - name: Setup registries
        run: |
          echo -e "\n//npm.pkg.github.com/:_authToken=$GITHUB_TOKEN" >> .npmrc
          echo -e "\n//npm.pkg.github.com/:_authToken=$GITHUB_TOKEN" >> ~/.npmrc
          echo -e "\n//registry.npmjs.org/:_authToken=$NPM_TOKEN" >> .npmrc
          echo -e "\n//registry.npmjs.org/:_authToken=$NPM_TOKEN" >> ~/.npmrc
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Setup Aftman
        uses: ok-nick/setup-aftman@v0.4.2
        with:
          version: 'v0.3.0'
          token: ${{ secrets.GITHUB_TOKEN }}
          cache: true

      - name: Build all tools
        run: pnpm -r --filter './tools/**' run build

      - name: Install nevermore-cli locally
        run: npm install --ignore-scripts -g .
        working-directory: tools/nevermore-cli

      - name: Download test places outside the checkout
        uses: actions/download-artifact@v4
        with:
          name: pr-${{ env.NEVERMORE_CI_PR_NUMBER }}.nevermore.tests
          path: ${{ env.BUNDLE_DIR }}
          run-id: ${{ env.BUILD_RUN_ID }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Run tests
        id: run-tests
        run: >-
          nevermore batch test --cloud --bundle "$BUNDLE_DIR/pr-$NEVERMORE_CI_PR_NUMBER.nevermore.tests.tar"
          --output test-results.json --yes --verbose --logs
        env:
          ROBLOX_OPEN_CLOUD_API_KEY: ${{ secrets.ROBLOX_UNIT_TEST_API_KEY }}

      - name: Post test results
        if: always() && env.NEVERMORE_CI_PR_NUMBER
        run: nevermore tools post-test-results test-results.json --sourcemap "$BUNDLE_DIR/sourcemap.json" --yes --run-outcome ${{ steps.run-tests.outcome }}

      # This job's own check lands on main's commit; the PR needs `tests` on its own.
      - name: Report tests on the PR commit
        if: always() && env.HEAD_SHA
        run: >-
          gh api "repos/${{ github.repository }}/check-runs"
          -f name=tests -f head_sha="$HEAD_SHA" -f status=completed -f conclusion=${{ job.status }}
          -f details_url="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
