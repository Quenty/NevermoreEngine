name: integration-forks
on:
  workflow_run:
    workflows: [integration]
    types: [completed]
  workflow_dispatch:
    inputs:
      pr:
        description: PR number of the fork PR to deploy
        required: true
        type: number

permissions:
  contents: read
  actions: read
  checks: write
  issues: write
  pull-requests: write

concurrency:
  group: integration-forks-${{ inputs.pr || format('{0}:{1}', github.event.workflow_run.head_repository.full_name, github.event.workflow_run.head_branch) }}
  cancel-in-progress: true

jobs:
  integration:
    if: >-
      github.event_name == 'workflow_dispatch' || (
        github.event.workflow_run.event == 'pull_request' &&
        github.event.workflow_run.head_repository.full_name != github.repository
      )
    runs-on: ubuntu-latest
    environment: integration
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      BUNDLE_DIR: ${{ github.workspace }}/../integration-forks-uploads
    steps:
      - name: Checkout main
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Find the PR's build
        uses: ./.github/actions/find-fork-pr-build
        with:
          build-workflow: integration.yml
          build-job: integration-build
          pr: ${{ inputs.pr }}

      - name: Set up the Nevermore CLI
        uses: ./.github/actions/setup-nevermore-cli
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          npm-token: ${{ secrets.NPM_TOKEN }}

      - name: Download integration places outside the checkout
        uses: actions/download-artifact@v4
        with:
          name: pr-${{ env.NEVERMORE_CI_PR_NUMBER }}.nevermore.deploy
          path: ${{ env.BUNDLE_DIR }}
          run-id: ${{ env.BUILD_RUN_ID }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Deploy integration games
        id: deploy-integration
        run: >-
          nevermore batch deploy --target integration --publish --bundle "$BUNDLE_DIR/pr-$NEVERMORE_CI_PR_NUMBER.nevermore.deploy.tar" --bundle-commit "$HEAD_SHA"
          --output integration-results.json --yes --verbose --logs
        env:
          ROBLOX_OPEN_CLOUD_API_KEY: ${{ secrets.ROBLOX_UNIT_TEST_API_KEY }}

      - name: Post integration results
        if: always() && env.NEVERMORE_CI_PR_NUMBER
        run: nevermore tools post-deploy-results integration-results.json --yes --run-outcome ${{ steps.deploy-integration.outcome }}

      - name: Report integration on the PR commit
        if: always() && env.HEAD_SHA
        uses: ./.github/actions/report-fork-pr-check
        with:
          name: integration
          conclusion: ${{ job.status }}
